spring.application.name=ai-used-car-assistant

# Render provides PORT automatically; 8080 is used locally.
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ---- Database (set these as Environment Variables on Render) ----
# DB_URL      e.g. jdbc:postgresql://HOST:5432/DBNAME   or   jdbc:mysql://HOST:3306/DBNAME?sslMode=REQUIRED
# DB_USERNAME database user
# DB_PASSWORD database password
# The default below is for local development only (MySQL on your own PC).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/car_ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- CORS ----
# Comma-separated list of frontend URLs allowed to call this API.
# On Render set CORS_ALLOWED_ORIGINS to your deployed frontend URL (no trailing slash).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
